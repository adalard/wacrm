version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wacrm-evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    ports:
      - "54322:5432" # Custom local port to avoid collision with standard Postgres (5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wacrm-evolution-redis
    restart: always
    ports:
      - "63799:6379" # Custom local port to avoid collision with standard Redis (6379)
    volumes:
      - redisdata:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: wacrm-evolution-api
    restart: always
    ports:
      - "443:8080"
    volumes:
      - ./certs:/certs:ro
    environment:
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=wacrm_dev_secret_key
      
      # Database Config
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?sslmode=disable
      
      # Redis cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution_cache
      
      # Webhook Configuration
      # When webhooks fire, we will register the local Next.js address later
      - WEBHOOK_GLOBAL_ENABLED=false # We will register webhook per-instance for maximum control
      
      # Sessions Settings
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_CLIENT=wacrm

      # SSL Config
      - SERVER_TYPE=https
      - SSL_CONF_PRIVKEY=/certs/evolution.key
      - SSL_CONF_FULLCHAIN=/certs/evolution.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  redisdata:
