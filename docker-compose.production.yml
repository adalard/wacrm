version: '3.8'

services:
  # ============================================================
  # WACRM — Next.js Application (port 3000)
  # ============================================================
  wacrm:
    container_name: wacrm-app
    image: wacrm-app:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    depends_on:
      evolution-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================
  # Evolution API — WhatsApp Business API Gateway (port 8080)
  # ============================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: wacrm-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=wacrm_dev_secret_key

      # Database Config
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?sslmode=disable

      # Redis cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution_cache

      # Webhook Configuration
      - WEBHOOK_GLOBAL_ENABLED=false

      # Sessions Settings
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CONFIG_SESSION_PHONE_CLIENT=wacrm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================
  # PostgreSQL — Evolution API Database (port 54322)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: wacrm-evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ============================================================
  # Redis — Evolution API Cache (port 63799)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: wacrm-evolution-redis
    restart: always
    ports:
      - "63799:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
